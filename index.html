<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Grid Anomaly Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.31.1/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.31.1/build/stlite.js"></script>
    <script>
      const repoUrl = "https://raw.githubusercontent.com/dvn1234op/GRID-ANOMALY/main";
      
      stlite.mount(
        {
          requirements: ["pandas", "matplotlib"],
          entrypoint: "app.py",
          files: {
            "app.py": { url: repoUrl + "/app.py" },
            "results/forecast_metrics_overall.csv": { url: repoUrl + "/results/forecast_metrics_overall.csv" },
            "results/forecast_metrics_by_hour.csv": { url: repoUrl + "/results/forecast_metrics_by_hour.csv" },
            "results/forecast_metrics_by_acorn.csv": { url: repoUrl + "/results/forecast_metrics_by_acorn.csv" },
            "results/forecast_metrics_by_tariff.csv": { url: repoUrl + "/results/forecast_metrics_by_tariff.csv" },
            "results/reporting_output.csv": { url: repoUrl + "/results/reporting_output.csv" },
            "results/anomaly_metrics.txt": { url: repoUrl + "/results/anomaly_metrics.txt" },
            // Pass the image URL so app.py can display it from the web instead of local file system
            "results/detector_A_example.png": { url: repoUrl + "/results/detector_A_example.png" }
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
